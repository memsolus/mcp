workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

stages:
  - preflight
  - install
  - validate
  - test
  - build
  - publish
  - release

variables:
  BUN_INSTALL_CACHE: .bun-cache

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .bun-cache/

check-version:
  stage: preflight
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - |
      VERSION=${CI_COMMIT_TAG#v}
      echo "Checking if @memsolus/mcp@${VERSION} exists on npm..."

      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@memsolus%2fmcp/${VERSION}")

      if [ "$HTTP_STATUS" = "200" ]; then
        echo "ERROR: Version ${VERSION} already published on npm!"
        exit 1
      fi

      echo "Version ${VERSION} not found on npm (HTTP ${HTTP_STATUS}). Proceeding."

install:
  stage: install
  image: oven/bun:1-alpine
  script:
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

typecheck:
  stage: validate
  image: oven/bun:1-alpine
  needs: [install]
  script:
    - bun run typecheck

test:
  stage: test
  image: oven/bun:1-alpine
  needs: [install]
  script:
    - bun run test -- --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

build:
  stage: build
  image: oven/bun:1-alpine
  needs: [install, typecheck, test]
  script:
    - bun run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

publish-npm:
  stage: publish
  image: node:22-alpine
  needs: [build]
  script:
    - chmod +x scripts/publish.sh && ./scripts/publish.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
      when: manual
      allow_failure: false

release-gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [publish-npm]
  before_script:
    - apk add --no-cache git curl jq
  script:
    - chmod +x scripts/release.sh && ./scripts/release.sh
